# cargo-deny configuration for JustUI CLI
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
ignore = [
    # RUSTSEC-2025-0141 - `bincode` is unmaintained upstream.
    # Justification:
    #   * Pulled in transitively by CLI dependencies.
    #   * Used strictly for static template/asset serialization in CLI context,
    #     not processing untrusted network payloads.
    # Re-evaluate when `bincode` v2 is adopted or dependencies migrate.
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
