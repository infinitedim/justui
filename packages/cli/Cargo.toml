[package]
name = "justui"
version = "0.1.0"
edition = "2021"
authors = ["JustUI Contributors"]
description = "JustUI CLI - Scaffolding and copy-paste component tool for Flutter."

[[bin]]
name = "justui"
path = "src/main.rs"

[lib]
name = "justui_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
anyhow = "1"
colored = "2"
dialoguer = "0.11"
similar = "3"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
