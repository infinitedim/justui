name: showcase
description: "JustUI bridge: renders the real core components on the docs pages (Flutter web, Wasm, multi-view)."
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  just_ui_core:
    path: ../../packages/core
  just_ui_tokens:
    path: ../../packages/tokens

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Core uses Material icons (date picker, input, toast, carousel).
  uses-material-design: true
  # assets/fonts is a symlink to packages/tokens/assets/fonts (see its README).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    # The skwasm renderer always loads a family named Roboto as its default
    # and fetches it from fonts.gstatic.com when the app does not declare
    # one. That request breaks the docs CSP, so Roboto maps to Plus Jakarta
    # Sans here.
    - family: Roboto
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
