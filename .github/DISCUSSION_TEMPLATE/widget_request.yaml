title: "Widget Request: "
description: Propose a new widget component for JustUI.
labels: ["widget-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new widget for JustUI! Please fill out the details below.
  - type: input
    id: widget-name
    attributes:
      label: Proposed Widget Name
      description: What should the widget be named? E.g., JustButton, JustCard, JustDialog.
      placeholder: E.g., JustDialog
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem this widget solves and why it is a valuable addition to JustUI.
      placeholder: E.g., This component is needed to display modals and alerts...
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Key Features & Properties
      description: Describe the expected customizable parameters and properties (e.g. style variants, sizes, colors, callbacks).
      placeholder: E.g., title, content, actions, transition types...
    validations:
      required: true
  - type: textarea
    id: design-reference
    attributes:
      label: Design & Motion Reference
      description: If applicable, paste designs, screenshots, interactive mockups, or links to references (e.g. Radix UI, Tailwind, Figma).
      placeholder: Link to design specs or paste image...
