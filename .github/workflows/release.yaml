name: Release CLI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions: {}

jobs:
  apply-changesets:
    name: "Apply Changesets & Bump Versions"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # persist-credentials needed to push version bumps and changelogs
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "apps/docs/package.json"
          # Release builds never restore a cache (cache poisoning).
          no-cache: true

      - name: Install root dependencies
        run: bun ci

      - name: Setup Flutter SDK
        # Same installer as CI: the .fvmrc release, SHA-256 checked, no cache.
        run: |
          root="$(bash apps/docs/scripts/install-flutter.sh "$RUNNER_TEMP/flutter-sdk")"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Check for pending changesets
        id: check-changesets
        run: |
          NPM_COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          POLY_COUNT=$(find .changeset-polyglot -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_COUNT=$((NPM_COUNT + POLY_COUNT))
          echo "npm_count=$NPM_COUNT" >> $GITHUB_OUTPUT
          echo "poly_count=$POLY_COUNT" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "Pending changesets — npm: $NPM_COUNT, polyglot: $POLY_COUNT, total: $TOTAL_COUNT"

      - name: Apply Dart package version bumps
        if: steps.check-changesets.outputs.poly_count != '0'
        run: dart run tools/apply_changesets.dart

      - name: Apply Rust CLI version bump
        if: steps.check-changesets.outputs.poly_count != '0'
        run: |
          chmod +x tools/apply_changesets_cargo.sh
          bash tools/apply_changesets_cargo.sh

      - name: Clean up polyglot changesets
        if: steps.check-changesets.outputs.poly_count != '0'
        run: |
          find .changeset-polyglot -maxdepth 1 -name "*.md" ! -name "README.md" -delete

      - name: Re-sign registry index
        if: steps.check-changesets.outputs.poly_count != '0'
        run: cargo run -p justui -- sign-registry

      - name: Regenerate docs component metadata
        if: steps.check-changesets.outputs.poly_count != '0'
        run: |
          cd apps/docs
          bun run generate:components

      - name: Generate changelogs
        if: steps.check-changesets.outputs.npm_count != '0'
        run: bun changeset version

      - name: Commit version bumps and changelogs
        if: steps.check-changesets.outputs.total_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit after applying changesets."
          else
            git commit -m "chore: apply changesets and bump versions [skip ci]"
            git push
          fi

  # ── Tag validation guard ──────────────────────────────────────────────────
  validate-tag-version:
    name: "Validate Cargo Version Matches Git Tag"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Version Consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version *= *["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' packages/cli/Cargo.toml | head -n 1)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Mismatch! Git tag 'v$TAG_VERSION' but Cargo.toml is '$CARGO_VERSION'."
            exit 1
          fi
          echo "✔ Versions match: $TAG_VERSION"

  # ── Linux builds ────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [validate-tag-version]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install cargo-auditable
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-auditable

      - name: Build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo auditable build --release --locked --target ${{ matrix.target }} --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        run: |
          BINARY=${{ github.workspace }}/target/${{ matrix.target }}/release/justui
          ARCHIVE=justui-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" justui
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: justui-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── macOS native builds ───────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    needs: [validate-tag-version]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Install cargo-auditable
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-auditable

      - name: Build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo auditable build --release --locked --target ${{ matrix.target }} --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        run: |
          BINARY=${{ github.workspace }}/target/${{ matrix.target }}/release/justui
          ARCHIVE=justui-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" justui
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: justui-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── Windows native build ──────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    permissions:
      contents: read
    needs: [validate-tag-version]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-auditable
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-auditable

      - name: Build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\target
        run: cargo auditable build --release --locked --target x86_64-pc-windows-msvc --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $binary = "${{ github.workspace }}\target\$target\release\justui.exe"
          $archive = "justui-$target.zip"
          Compress-Archive -Path $binary -DestinationPath $archive
          echo "ARCHIVE=$archive" | Out-File -Append $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: justui-x86_64-pc-windows-msvc
          path: ${{ env.ARCHIVE }}

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    environment: release
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/

      - name: Collect archives
        run: |
          mkdir -p release_assets
          find dist/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec cp {} release_assets/ \;
          cp packages/cli/install/install.sh release_assets/
          cp packages/cli/install/install.ps1 release_assets/

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release_assets/*.tar.gz
            release_assets/*.zip

      - name: Generate checksums
        run: |
          cd release_assets
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "Error: No release archives found to checksum." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" | sort -k 2 > SHA256SUMS
          cp SHA256SUMS checksums.txt

      # Releases are immutable: assets cannot be added once a release is
      # published. Create a draft, upload every asset, then publish.
      - name: Create draft release and upload assets
        id: draft
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: JustUI CLI ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release_assets/*.tar.gz
            release_assets/*.zip
            release_assets/SHA256SUMS
            release_assets/checksums.txt
            release_assets/install.sh
            release_assets/install.ps1
          generate_release_notes: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::The draft release id is empty; nothing to publish."
            exit 1
          fi
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false
