name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Linux cross-compilation via `cross` ──────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        run: |
          BINARY=target/${{ matrix.target }}/release/justui
          ARCHIVE=justui-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" justui
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: justui-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── macOS native builds ───────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        run: |
          BINARY=target/${{ matrix.target }}/release/justui
          ARCHIVE=justui-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" justui
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: justui-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── Windows native build ──────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $binary = "target\$target\release\justui.exe"
          $archive = "justui-$target.zip"
          Compress-Archive -Path $binary -DestinationPath $archive
          echo "ARCHIVE=$archive" | Out-File -Append $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: justui-x86_64-pc-windows-msvc
          path: ${{ env.ARCHIVE }}

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Collect archives
        run: |
          mkdir -p release_assets
          find dist/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec cp {} release_assets/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: JustUI CLI ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_assets/*
          generate_release_notes: true
