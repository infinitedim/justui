name: Release CLI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apply-changesets:
    name: "Apply Changesets & Bump Versions"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check for pending changesets
        id: check-changesets
        run: |
          COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Pending changesets: $COUNT"

      - name: Apply Dart package version bumps
        if: steps.check-changesets.outputs.count != '0'
        run: dart run tools/apply_changesets.dart

      - name: Apply Rust CLI version bump
        if: steps.check-changesets.outputs.count != '0'
        run: |
          chmod +x tools/apply_changesets_cargo.sh
          bash tools/apply_changesets_cargo.sh

      - name: Generate changelogs
        if: steps.check-changesets.outputs.count != '0'
        run: bun changeset version

      - name: Commit version bumps and changelogs
        if: steps.check-changesets.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply changesets and bump versions [skip ci]"
          git push

  # ── Linux cross-compilation via `cross` ──────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        run: |
          BINARY=packages/cli/target/${{ matrix.target }}/release/justui
          ARCHIVE=justui-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" justui
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: justui-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── macOS native builds ───────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        run: |
          BINARY=packages/cli/target/${{ matrix.target }}/release/justui
          ARCHIVE=justui-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" justui
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: justui-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── Windows native build ──────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path packages/cli/Cargo.toml

      - name: Package archive
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $binary = "packages/cli/target\$target\release\justui.exe"
          $archive = "justui-$target.zip"
          Compress-Archive -Path $binary -DestinationPath $archive
          echo "ARCHIVE=$archive" | Out-File -Append $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: justui-x86_64-pc-windows-msvc
          path: ${{ env.ARCHIVE }}

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Collect archives
        run: |
          mkdir -p release_assets
          find dist/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec cp {} release_assets/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: JustUI CLI ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release_assets/*
          generate_release_notes: true
