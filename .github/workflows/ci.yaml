name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions: {}

jobs:
  # Job 1: Validasi dan testing Dart & Flutter Packages (Melos)
  dart-flutter-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Install Dart & global tools
        run: |
          dart pub global activate melos

      - name: Bootstrap Monorepo
        run: |
          melos bootstrap

      - name: Verify Formatting
        run: |
          dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: |
          melos exec --flutter -- "flutter analyze ."
          melos exec --no-flutter -- "dart analyze ."

      - name: Check Hidden Unicode
        run: |
          dart run tools/check_hidden_unicode.dart

      - name: Verify Registry Checksums
        run: |
          dart run tools/generate_checksums.dart --dry-run

      - name: Validate MDX Dart Snippets
        run: |
          dart run tools/validate_mdx_snippets.dart

      - name: Verify Tools Shell Scripts
        run: |
          bash -n tools/*.sh

      - name: Run Tests
        run: |
          melos exec --flutter --dir-exists="test" -- "flutter test"
          melos exec --no-flutter --dir-exists="test" -- "dart test"

  # Job 2: Validasi dan testing Next.js Documentation Portal (Bun)
  nextjs-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "apps/docs/package.json"

      - name: Install Dependencies
        run: |
          cd apps/docs
          bun ci

      - name: Verify Formatting & Linting
        run: |
          cd apps/docs
          bun run format:check
          bun run lint

      - name: Verify Component Data
        run: |
          cd apps/docs
          bun run generate:components -- --check

      - name: Type Check
        run: |
          cd apps/docs
          bun run type-check

      - name: Run Unit Tests
        run: |
          cd apps/docs
          bun run test

      - name: Build Next.js App
        run: |
          cd apps/docs
          bun run build

      - name: Verify Bundle Budget
        run: |
          cd apps/docs
          bun run budget:check

      - name: Install Playwright Browsers
        run: |
          cd apps/docs
          bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd apps/docs
          bun run test:e2e

  cli-check:
    name: "CLI — Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Verify Rust formatting
        run: cargo fmt --all --check

      - name: Run cargo check
        run: cargo check --all-targets

  cli-clippy:
    name: "CLI — Clippy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: cli-check
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  cli-deny:
    name: "CLI - Cargo Deny"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: cli-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.1"

      - name: Install cargo-deny
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # v2.49.27
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check

  cli-machete:
    name: "CLI — Unused Dependencies"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: cli-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # v2.49.27
        with:
          tool: cargo-machete

      - name: Run cargo-machete
        run: cargo machete

  cli-build:
    name: "CLI - Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: [cli-check, cli-clippy]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release

  cli-test:
    name: "CLI - Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Run tests
        run: cargo test --all-targets

  cli-coverage:
    name: "CLI - Coverage"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # v2.49.27
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --fail-under-lines 70 --lcov --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only

  zizmor:
    name: "Security - zizmor"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # v2.49.27
        with:
          tool: zizmor

      - name: Run zizmor
        run: zizmor --persona=pedantic --min-severity=high .github/workflows/
