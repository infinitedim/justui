name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dart & global tools
        run: |
          dart pub global activate melos

      - name: Bootstrap Monorepo
        run: |
          export MELOS_SDK_PATH="$FLUTTER_ROOT"
          melos bootstrap

      - name: Verify Formatting
        run: |
          dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: |
          dart analyze packages/just_ui_tokens
          dart analyze packages/just_ui_core
          dart analyze packages/just_ui_cli

      - name: Run Tests
        run: |
          flutter test packages/just_ui_tokens
          flutter test packages/just_ui_core
          cd packages/just_ui_cli && dart test
