name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # Job 1: Validasi dan testing Dart & Flutter Packages (Melos)
  dart-flutter-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dart & global tools
        run: |
          dart pub global activate melos

      - name: Setup FVM Symlink for Melos
        run: |
          mkdir -p .fvm
          FLUTTER_SDK_PATH="${FLUTTER_ROOT:-$(dirname $(dirname $(which flutter)))}"
          echo "Setting up FVM symlink to: $FLUTTER_SDK_PATH"
          ln -sf "$FLUTTER_SDK_PATH" .fvm/flutter_sdk

      - name: Bootstrap Monorepo
        run: |
          melos bootstrap

      - name: Verify Formatting
        run: |
          dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: |
          melos exec --flutter -- "flutter analyze ."
          melos exec --no-flutter -- "dart analyze ."

      - name: Run Tests
        run: |
          melos exec --flutter --dir-exists="test" -- "flutter test"
          melos exec --no-flutter --dir-exists="test" -- "dart test"

  # Job 2: Validasi dan testing Next.js Documentation Portal (Bun)
  nextjs-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd apps/docs
          bun install --frozen-lockfile

      - name: Verify Formatting & Linting
        run: |
          cd apps/docs
          bun run lint

      - name: Run Unit Tests
        run: |
          cd apps/docs
          bun run test

      - name: Build Next.js App
        run: |
          cd apps/docs
          bun run build

      - name: Install Playwright Browsers
        run: |
          cd apps/docs
          bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd apps/docs
          bun run test:e2e

  cli-check:
    name: "CLI — Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Run cargo check
        run: cargo check --all-targets

  cli-clippy:
    name: "CLI — Clippy"
    runs-on: ubuntu-latest
    needs: cli-check
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  cli-cargo-audit:
    name: "CLI — Cargo Audit"
    runs-on: ubuntu-latest
    needs: cli-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  cli-build:
    name: "CLI — Build"
    runs-on: ubuntu-latest
    needs: [cli-check, cli-clippy]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release

  cli-test:
    name: "CLI — Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Run tests
        run: cargo test --all-targets

  cli-coverage:
    name: "CLI — Coverage"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only
