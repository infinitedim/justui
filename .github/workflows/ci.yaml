name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dart & global tools
        run: |
          dart pub global activate melos

      - name: Setup FVM Symlink for Melos
        run: |
          mkdir -p .fvm
          FLUTTER_SDK_PATH="${FLUTTER_ROOT:-$(dirname $(dirname $(which flutter)))}"
          echo "Setting up FVM symlink to: $FLUTTER_SDK_PATH"
          ln -sf "$FLUTTER_SDK_PATH" .fvm/flutter_sdk

      - name: Bootstrap Monorepo
        run: |
          melos bootstrap

      - name: Verify Formatting
        run: |
          dart format --output=none --set-exit-if-changed .

      # - name: Static Analysis
      #   run: |
      #     dart analyze packages/just_ui_tokens
      #     dart analyze packages/just_ui_core
      #     dart analyze packages/just_ui_cli

      - name: Run Tests
        run: |
          flutter test packages/just_ui_tokens
          flutter test packages/just_ui_core
          cd packages/just_ui_cli && dart test
