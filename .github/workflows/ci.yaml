name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions: {}

jobs:
  # Job 1: Validasi dan testing Dart & Flutter Packages (Melos)
  dart-flutter-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "apps/docs/package.json"

      - name: Set up Flutter SDK
        # Third-party Flutter setup actions pull actions/cache by tag, which
        # the repo's full-SHA pinning policy rejects. This installs the
        # release .fvmrc names ("stable") and checks the archive SHA-256
        # against Flutter's official release index.
        run: |
          root="$(bash apps/docs/scripts/install-flutter.sh "$RUNNER_TEMP/flutter-sdk")"
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Dart & global tools
        run: |
          dart pub global activate melos

      - name: Bootstrap Monorepo
        run: |
          melos bootstrap

      - name: Verify Formatting
        run: |
          dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: |
          melos exec --flutter -- "flutter analyze ."
          melos exec --no-flutter -- "dart analyze ."

      - name: Check Hidden Unicode
        run: |
          dart run tools/check_hidden_unicode.dart

      - name: Verify Registry Checksums
        run: |
          dart run tools/generate_checksums.dart --dry-run

      - name: Validate MDX Dart Snippets
        run: |
          dart run tools/validate_mdx_snippets.dart

      - name: Verify Tools Shell Scripts
        run: |
          bash -n tools/*.sh

      - name: Run Tests
        run: |
          melos exec --flutter --dir-exists="test" -- "flutter test --exclude-tags golden"
          melos exec --no-flutter --dir-exists="test" -- "dart test"

  # Job 1b: the Flutter bridge bundle (apps/showcase, Wasm) for the docs
  showcase-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "apps/docs/package.json"

      - name: Set up Flutter SDK
        # Third-party Flutter setup actions pull actions/cache by tag, which
        # the repo's full-SHA pinning policy rejects. This installs the
        # release .fvmrc names ("stable") and checks the archive SHA-256
        # against Flutter's official release index.
        run: |
          root="$(bash apps/docs/scripts/install-flutter.sh "$RUNNER_TEMP/flutter-sdk")"
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Showcase golden tests
        run: |
          cd apps/showcase
          flutter pub get --enforce-lockfile
          flutter test --tags golden

      - name: Build the bridge bundle
        run: |
          cd apps/docs
          FLUTTER_BIN="$(command -v flutter)" bun scripts/build-flutter.ts

      - name: Verify the bundle budget
        run: |
          cd apps/docs
          bun scripts/check-flutter-budget.ts

      - name: Upload the bridge bundle
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: flutter-bundle
          path: apps/docs/public/flutter
          if-no-files-found: error
          retention-days: 3

  # Job 2: Validasi dan testing Next.js Documentation Portal (Bun)
  nextjs-ci:
    runs-on: ubuntu-latest
    # The e2e suite mounts the live Flutter parts from this bundle.
    needs: showcase-web
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "apps/docs/package.json"

      - name: Install Dependencies
        run: |
          cd apps/docs
          bun ci

      - name: Download the bridge bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-bundle
          path: apps/docs/public/flutter

      - name: Verify the bridge bundle
        run: |
          test -f apps/docs/public/flutter/flutter_bootstrap.js
          cd apps/docs
          bun scripts/check-flutter-budget.ts

      - name: Verify Formatting & Linting
        run: |
          cd apps/docs
          bun run format:check
          bun run lint

      - name: Verify Component Data
        run: |
          cd apps/docs
          bun run generate:components -- --check

      - name: Type Check
        run: |
          cd apps/docs
          bun run type-check

      - name: Run Unit Tests
        run: |
          cd apps/docs
          bun run test

      - name: Build Next.js App
        run: |
          cd apps/docs
          bun run build

      - name: Verify Bundle Budget
        run: |
          cd apps/docs
          bun run budget:check

      - name: Install Playwright Browsers
        run: |
          cd apps/docs
          bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd apps/docs
          bun run test:e2e

  cli-check:
    name: "CLI — Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Verify Rust formatting
        run: cargo fmt --all --check

      - name: Run cargo check
        run: cargo check --all-targets

  cli-clippy:
    name: "CLI — Clippy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: cli-check
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  cli-deny:
    name: "CLI - Cargo Deny"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: cli-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check

  cli-machete:
    name: "CLI — Unused Dependencies"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: cli-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # v2.49.27
        with:
          tool: cargo-machete

      - name: Run cargo-machete
        run: cargo machete

  cli-build:
    name: "CLI - Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: [cli-check, cli-clippy]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release

  cli-test:
    name: "CLI - Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install OpenSSL dev dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Run tests
        run: cargo test --all-targets

  cli-coverage:
    name: "CLI - Coverage"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install OpenSSL dev dependencies
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # v2.49.27
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --fail-under-lines 70 --lcov --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only

  zizmor:
    name: "Security - zizmor"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # v2.49.27
        with:
          tool: zizmor

      - name: Run zizmor
        run: zizmor --persona=pedantic --min-severity=high .github/workflows/
