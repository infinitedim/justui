name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Job 1: Validasi dan testing Dart & Flutter Packages (Melos)
  dart-flutter-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dart & global tools
        run: |
          dart pub global activate melos

      - name: Setup FVM Symlink for Melos
        run: |
          mkdir -p .fvm
          FLUTTER_SDK_PATH="${FLUTTER_ROOT:-$(dirname $(dirname $(which flutter)))}"
          echo "Setting up FVM symlink to: $FLUTTER_SDK_PATH"
          ln -sf "$FLUTTER_SDK_PATH" .fvm/flutter_sdk

      - name: Bootstrap Monorepo
        run: |
          melos bootstrap

      - name: Verify Formatting
        run: |
          dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: |
          melos exec --flutter -- "flutter analyze ."
          melos exec --no-flutter -- "dart analyze ."

      - name: Run Tests
        run: |
          melos exec --flutter --dir-exists="test" -- "flutter test"
          melos exec --no-flutter --dir-exists="test" -- "dart test"

  # Job 2: Validasi dan testing Next.js Documentation Portal (Bun)
  nextjs-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd apps/docs
          bun install --frozen-lockfile

      - name: Verify Formatting & Linting
        run: |
          cd apps/docs
          bun run lint

      - name: Run Unit Tests
        run: |
          cd apps/docs
          bun test run
