name: CLI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    defaults:
      run:
        working-directory: packages/cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Install OpenSSL dev dependencies (Linux native)
        if: matrix.os == 'ubuntu-latest' && matrix.cross != true
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build binary (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary (tar.gz — Linux/macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/justui"
          ARCHIVE_NAME="justui-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" justui
          echo "ASSET_PATH=packages/cli/$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "ASSET_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Package binary (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $binaryPath = "target\${{ matrix.target }}\release\justui.exe"
          $archiveName = "justui-${{ matrix.target }}.zip"
          Compress-Archive -Path $binaryPath -DestinationPath $archiveName
          echo "ASSET_PATH=packages/cli/$archiveName" >> $env:GITHUB_ENV
          echo "ASSET_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: justui-${{ matrix.target }}
          path: packages/cli/justui-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "JustUI CLI ${{ env.VERSION }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
