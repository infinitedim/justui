name: Project Automation (Auto Triage)

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, ready_for_review]

jobs:
  add-to-project:
    name: Add Issue/PR to GitHub Project
    runs-on: ubuntu-latest
    steps:
      - name: Add to Project
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: "https://github.com/users/infinitedim/projects/2"
          github-token: ${{ secrets.PROJECT_PAT || secrets.GITHUB_TOKEN }}
