version: 2
updates:
  # Maintain dependencies for root pubspec
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
  # Maintain dependencies for just_ui_tokens package
  - package-ecosystem: "pub"
    directory: "/packages/just_ui_tokens"
    schedule:
      interval: "weekly"
  # Maintain dependencies for just_ui_core package
  - package-ecosystem: "pub"
    directory: "/packages/just_ui_core"
    schedule:
      interval: "weekly"
  # Maintain dependencies for just_ui_cli package
  - package-ecosystem: "pub"
    directory: "/packages/just_ui_cli"
    schedule:
      interval: "weekly"
  # Maintain GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
