name: Bug Report
description: Create a report to help us fix bugs in JustUI CLI or components.
title: "fix(): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.
  - type: dropdown
    id: component
    attributes:
      label: Affected Package / Component
      description: Which module has the issue?
      options:
        - just_ui_cli (Rust CLI)
        - just_ui_core (Theme Engine)
        - just_ui_tokens (Design Tokens)
        - Preset Style / UI Widgets
        - Docs & Examples
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 1. Bug Description & Reproduction
      description: Describe what happens and steps to reproduce.
      placeholder: |
        # Problem Description
        Describe the bug...

        # Steps to Reproduce
        1. Run `justui ...`
        2. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 2. Expected vs Actual Behavior
      description: What should have happened instead?
  - type: textarea
    id: code_or_logs
    attributes:
      label: 3. Panic Trace / Stack Trace / Logs
      description: Paste any Rust panic backtraces, terminal output, or Dart stack traces.
      render: shell
